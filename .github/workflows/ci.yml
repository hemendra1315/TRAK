name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Versions are emitted as annotations so they can be read from the check run
      # without downloading logs, and recorded in ADR 0001 as evidence.
      - name: Toolchain report
        run: |
          chmod +x .github/scripts/gradle-annotate.sh
          ./gradlew --version | tee gradle-version.txt
          echo "::notice title=Gradle and JVM::$(grep -E '^(Gradle|Kotlin|Launcher JVM|Daemon JVM)' gradle-version.txt | tr '\n' ';')"
          .github/scripts/gradle-annotate.sh buildEnvironment buildEnvironment > /dev/null
          lines=$(grep -oE "(org.jetbrains.kotlin:kotlin-gradle-plugin|com.android.tools.build:gradle|com.google.devtools.ksp:symbol-processing-gradle-plugin|com.google.dagger:hilt-android-gradle-plugin|androidx.room:room-gradle-plugin):[^ ]+( -> [^ ]+)?" gradle-buildEnvironment.log | sort -u | tr '\n' ';')
          echo "::notice title=Build classpath::${lines}"

      - name: Assemble debug
        run: .github/scripts/gradle-annotate.sh assembleDebug assembleDebug --stacktrace

      - name: Unit tests
        run: .github/scripts/gradle-annotate.sh test test --continue

      - name: Lint
        run: .github/scripts/gradle-annotate.sh lint lint

      - name: Room schema check
        if: always()
        run: |
          f=$(find core/data/schemas -name '*.json' 2>/dev/null | sort)
          if [ -z "$f" ]; then echo "::error title=Room schema::No exported schema found under core/data/schemas"; exit 1; fi
          for x in $f; do
            # Annotation messages are truncated around 4 KB, so emit base64 in numbered chunks.
            python3 -c "
          import base64,sys
          d=base64.b64encode(open(sys.argv[1],'rb').read()).decode()
          parts=[d[i:i+3000] for i in range(0,len(d),3000)]
          for n,p in enumerate(parts): print(f'::notice title=Room schema {sys.argv[1]} part {n+1}/{len(parts)}::{p}')
          " "$x"
          done
          if [ -n "$(git status --porcelain core/data/schemas)" ]; then
            echo "::error title=Room schema not committed::Exported schema differs from the committed copy. Commit core/data/schemas."
            exit 1
          fi

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test-summary.py "Unit tests" "**/build/test-results/test*/**/*.xml"

      - name: Resolved runtime versions
        if: always()
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > app-runtime-deps.txt 2>&1 || true
          lines=$(grep -oE "(org.jetbrains.kotlin:kotlin-stdlib|androidx.compose.ui:ui|androidx.compose.material3:material3|androidx.room:room-runtime|com.google.dagger:hilt-android|io.github.jan-tennert.supabase:auth-kt|io.ktor:ktor-client-core|org.jetbrains.kotlinx:kotlinx-serialization-json|org.jetbrains.kotlinx:kotlinx-coroutines-core):[^ ]+( -> [^ ]+)?" app-runtime-deps.txt | sort -u | tr '\n' ';')
          echo "::notice title=Resolved runtime versions::${lines}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            gradle-*.log
            gradle-*.txt
            app-runtime-deps.txt
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No service-role key references in app code
        run: |
          if grep -rniE "service_role|SERVICE_ROLE_KEY|sb_secret_" app core --include=*.kt --include=*.kts --include=*.xml; then
            echo "::error title=Secret reference::A service-role/secret key reference was found in app code (test A16)."
            exit 1
          fi
          echo "::notice title=A16::No service-role or secret key references in app or core modules."

  database:
    name: Database (local Supabase) and auth E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" makes an unauthenticated GitHub API call that fails on rate limits
          # (two failed runs on 17 Oct 2026). 2.121.0 is the version the green run used.
          version: 2.121.0

      - name: Start local Supabase
        run: |
          supabase --version | sed 's/^/::notice title=Supabase CLI::/'
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector 2>&1 | tee supabase-start.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 6000 supabase-start.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=supabase start failed::${msg}"
            exit "$status"
          fi

      - name: Reset database from migrations
        run: |
          supabase db reset 2>&1 | tee db-reset.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 6000 db-reset.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=db reset failed::${msg}"
          fi
          exit "$status"

      - name: pgTAP RLS tests (A11)
        run: |
          supabase test db 2>&1 | tee pgtap.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "^(ok|not ok|Files=|Result:|#)" pgtap.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          if [ "$status" -ne 0 ]; then
            echo "::error title=pgTAP failed::${summary}"
          else
            echo "::notice title=pgTAP::${summary}"
          fi
          exit "$status"

      - name: Email OTP and RLS end-to-end (A22)
        run: |
          eval "$(supabase status -o env)"
          export API_URL
          export ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export MAIL_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          python3 scripts/e2e_auth_rls.py 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          lines=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' e2e.log)
          if [ "$status" -ne 0 ]; then echo "::error title=E2E failed::${lines}"; else echo "::notice title=E2E::${lines}"; fi
          exit "$status"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin client integration test against local stack
        run: |
          chmod +x .github/scripts/gradle-annotate.sh
          eval "$(supabase status -o env)"
          export TRAK_IT_API_URL="$API_URL"
          export TRAK_IT_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export TRAK_IT_MAIL_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          .github/scripts/gradle-annotate.sh integration :core:data:testDebugUnitTest --tests "*SupabaseIntegrationTest*"

      - name: Integration test summary
        if: always()
        run: python3 .github/scripts/test-summary.py "Integration tests" "core/data/build/test-results/testDebugUnitTest/*Integration*.xml"

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: chmod +x .github/scripts/gradle-annotate.sh && .github/scripts/gradle-annotate.sh connected connectedDebugAndroidTest

      - name: Instrumented test summary
        if: always()
        run: python3 .github/scripts/test-summary.py "Instrumented tests" "**/build/outputs/androidTest-results/connected/**/*.xml"
